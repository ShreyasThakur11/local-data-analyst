[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "local-data-analyst"
version = "1.0.0"
description = "Local-first personal analytics copilot for MBA coursework and professional consulting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "plotly>=5.19.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
